# Toy Library — Supabase CLI project config.
# Local dev:  supabase start   (runs Postgres + Auth + Studio in Docker)
#             supabase db reset (applies migrations + seed.sql)
# Link cloud: supabase link --project-ref YOUR-REF && supabase db push

project_id = "toy-library"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/reset-password", "https://toy-library.fly.dev/reset-password"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
# Turn off for frictionless local dev; enable in the hosted project if you
# want confirmation emails before first login.
enable_confirmations = false
