name: Pilot — api-anything × Yoto Trustpilot

# PILOT ONLY (branch pilot/api-anything; never merged to main).
# Evaluates api-anything (github.com/goodnight000/api-anything,
# pinned commit below) for learning the Trustpilot product-rating
# request that Yoto's pages fire at runtime — the ratings our
# static-HTML crawler cannot see.
#
# Trigger note: GitHub only registers workflow_dispatch for
# workflows on the DEFAULT branch, so a branch-only pilot can't
# be dispatched. This workflow therefore runs on PUSH to the
# pilot branch and executes pilot/run.sh, which is committed on
# the branch and revised between runs (outline first, then
# teach + call once the outline has been read).

on:
  push:
    branches: [pilot/api-anything]

env:
  AA_COMMIT: 441e50905acea35f407127c2b8a4032e969288f7

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install api-anything (pinned)
        run: |
          set -e
          git clone -q https://github.com/goodnight000/api-anything.git /tmp/aa
          cd /tmp/aa && git checkout -q "$AA_COMMIT"
          npm ci --no-audit --no-fund
          npm install -g "$(npm pack --silent)"
          api-anything --version

      - name: Locate a Chromium for the teach tier
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No system Chrome; installing Playwright chromium"
            PW="$(npm root -g)/api-anything/node_modules/.bin/playwright"
            "$PW" install --with-deps chromium
            CHROME="$(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux/chrome | head -1)"
          fi
          echo "Using browser: $CHROME"
          "$CHROME" --version || true
          echo "API_ANYTHING_BROWSER=$CHROME" >> "$GITHUB_ENV"

      - name: Run the pilot driver
        run: bash pilot/run.sh

      - name: Upload pilot outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-output-${{ github.run_id }}
          path: |
            pilot-out
            ~/.api-anything
          retention-days: 7
          if-no-files-found: ignore
