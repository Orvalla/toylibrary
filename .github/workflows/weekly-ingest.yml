name: Weekly catalog scan

# Mondays: re-scan the tracked stores for net-new products,
# attach age guidance, and top up product ratings. Delta-only —
# the job never edits an existing catalog row (see
# ingestor/weekly.mjs), so curated data is safe. One narrow
# exception: the image backfill step only fills image_url
# where it is blank and never edits anything else.
on:
  schedule:
    - cron: '7 15 * * 1' # Mondays ~08:07 Pacific
  workflow_dispatch:
    inputs:
      dry:
        description: 'Dry run (scan and report, change nothing)'
        type: boolean
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Scan stores, insert net-new, top up ratings
        env:
          SUPABASE_URL: https://seskzmdgazqfuryrtgmg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEEKLY_DRY: ${{ inputs.dry && '1' || '' }}
        run: node ingestor/weekly.mjs
      - name: Backfill images for items that have none
        env:
          SUPABASE_URL: https://seskzmdgazqfuryrtgmg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          WEEKLY_DRY: ${{ inputs.dry && '1' || '' }}
        run: node ingestor/backfill-images.mjs --limit 200
      - name: Recompute popularity scores
        env:
          SUPABASE_URL: https://seskzmdgazqfuryrtgmg.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node ingestor/popularity.mjs ${{ inputs.dry && '--dry' || '' }}
