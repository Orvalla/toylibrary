# SPA on Fly: client-side routes (/s/:slug, /dashboard) must fall back to
# index.html instead of 404ing.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets can be cached hard; index.html must not be.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
