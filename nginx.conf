# SPA on Fly: client-side routes (/catalog, /dashboard) must fall back to
# index.html instead of 404ing.

# Link-preview crawlers (the bots behind iMessage / Messenger /
# Slack preview cards) don't run JavaScript, so on a family
# subdomain they'd only ever see the generic static OG tags.
# Requests for "/" from those agents are handed to the og-share
# Edge Function, which answers with that family's own preview
# tags. Humans are untouched — they always get the app.
map $http_user_agent $tl_crawler {
  default 0;
  ~*(facebookexternalhit|twitterbot|linkedinbot|slackbot|slackbots|discordbot|whatsapp|telegrambot|applebot|iframely|pinterestbot|redditbot) 1;
}

# The family slug is the subdomain label (fern.toylibrary.store
# → "fern"); the apex and unrelated hosts map to empty.
map $host $tl_famslug {
  default "";
  ~^(?<fam>[a-z0-9-]+)\.toylibrary\.store$ $fam;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # The root is every family's share link: crawlers get the
  # per-family preview, everyone else gets the app.
  location = / {
    error_page 418 = @ogshare;
    if ($tl_crawler) {
      return 418;
    }
    try_files /index.html =404;
  }

  location @ogshare {
    # The slug rides in a header, not the proxy_pass URL: a
    # variable in proxy_pass would make nginx demand a runtime
    # resolver and 502 without one.
    proxy_pass https://seskzmdgazqfuryrtgmg.supabase.co/functions/v1/og-share;
    proxy_set_header Host seskzmdgazqfuryrtgmg.supabase.co;
    proxy_set_header X-Family-Slug $tl_famslug;
    proxy_ssl_server_name on;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build assets can be cached hard; index.html must not be.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
